name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify release tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) process.exit(1)'
      - run: pnpm test
      - name: Pack and validate package
        run: pnpm test:package
        env:
          SPFX_FAST_PACKAGE_ARCHIVE: ${{ runner.temp }}/spfx-fast-core-release.tgz
      - name: Enable npm trusted publishing
        run: npm install --global npm@11.5.1
      - name: Publish validated tarball
        run: npm publish "$RUNNER_TEMP/spfx-fast-core-release.tgz" --access public

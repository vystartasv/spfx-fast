name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify release tag
        run: node -e 'const ref = process.env.GITHUB_REF_NAME; const versions = [require("./package.json").version, require("./packages/playwright/package.json").version]; if (!versions.some(version => ref === `v${version}`)) process.exit(1)'
      - run: pnpm test
      - name: Pack and validate package
        run: pnpm test:package
        env:
          SPFX_FAST_PACKAGE_ARCHIVE: ${{ runner.temp }}/spfx-fast-core-release.tgz
      - name: Pack Playwright package
        run: npm pack ./packages/playwright --pack-destination "$RUNNER_TEMP"
      - name: Install npm trusted-publishing client
        run: npm install --global npm@11.5.1
      - name: Publish new package versions
        shell: bash
        run: |
          core_version="$(node -p "require('./package.json').version")"
          playwright_version="$(node -p "require('./packages/playwright/package.json').version")"

          if npm view "@spfx-fast/core@$core_version" version >/dev/null 2>&1; then
            echo "@spfx-fast/core@$core_version is already published; skipping"
          else
            npm publish "$RUNNER_TEMP/spfx-fast-core-release.tgz" --access public
          fi

          if npm view "@spfx-fast/playwright@$playwright_version" version >/dev/null 2>&1; then
            echo "@spfx-fast/playwright@$playwright_version is already published; skipping"
          else
            npm publish "$RUNNER_TEMP/spfx-fast-playwright-$playwright_version.tgz" --access public
          fi
